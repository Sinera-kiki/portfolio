<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none" role="img" aria-label="Wanting portrait illustration">
  <!-- Soft background wash -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEEBE3" />
      <stop offset="100%" stop-color="#E4E1D8" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3E36" />
      <stop offset="100%" stop-color="#3A2E28" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9BAAB" />
      <stop offset="100%" stop-color="#8DA290" />
    </linearGradient>
  </defs>

  <rect width="240" height="300" fill="url(#bg)" />

  <!-- Botanical branch behind (Morandi green) -->
  <g stroke="#8DA290" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M 25 265 Q 45 220 55 175 Q 60 140 55 110" />
    <path d="M 55 200 Q 40 195 30 205" />
    <path d="M 58 175 Q 75 170 85 180" />
    <path d="M 56 145 Q 42 140 32 148" />
    <path d="M 58 118 Q 76 112 88 122" />
    <ellipse cx="30" cy="205" rx="6" ry="3" transform="rotate(-40 30 205)" fill="#C7D2C7" opacity="0.6" />
    <ellipse cx="85" cy="180" rx="6" ry="3" transform="rotate(35 85 180)" fill="#C7D2C7" opacity="0.6" />
    <ellipse cx="32" cy="148" rx="6" ry="3" transform="rotate(-40 32 148)" fill="#C7D2C7" opacity="0.6" />
    <ellipse cx="88" cy="122" rx="6" ry="3" transform="rotate(35 88 122)" fill="#C7D2C7" opacity="0.6" />
  </g>

  <g stroke="#8DA290" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 215 270 Q 200 230 195 190 Q 195 160 200 130" />
    <path d="M 195 190 Q 210 185 220 195" />
    <path d="M 197 160 Q 185 155 175 165" />
    <ellipse cx="220" cy="195" rx="6" ry="3" transform="rotate(35 220 195)" fill="#C7D2C7" opacity="0.6" />
    <ellipse cx="175" cy="165" rx="6" ry="3" transform="rotate(-40 175 165)" fill="#C7D2C7" opacity="0.6" />
  </g>

  <!-- Body / shoulders -->
  <path d="M 60 300 L 65 240 Q 80 220 120 218 Q 160 220 175 240 L 180 300 Z" fill="url(#shirt)" />
  <path d="M 65 240 Q 80 220 120 218 Q 160 220 175 240" stroke="#6E8574" stroke-width="0.8" fill="none" />

  <!-- Neck -->
  <path d="M 108 220 Q 110 205 110 195 L 130 195 Q 130 205 132 220 Z" fill="#F0D9C4" />

  <!-- Head -->
  <ellipse cx="120" cy="150" rx="42" ry="50" fill="#F5DEC8" />

  <!-- Hair back -->
  <path d="M 78 145 Q 72 105 100 88 Q 120 78 145 90 Q 168 105 165 148 Q 168 175 158 195 L 155 172 Q 158 150 155 138 Q 145 110 120 108 Q 95 110 88 138 Q 82 155 85 175 L 82 195 Q 72 175 78 145 Z" fill="url(#hair)" />

  <!-- Bangs / fringe -->
  <path d="M 85 135 Q 92 118 108 116 Q 118 118 122 128 Q 130 116 145 118 Q 158 122 158 138 Q 152 132 145 132 Q 135 130 128 138 Q 122 128 115 130 Q 100 128 92 140 Q 88 138 85 135 Z" fill="url(#hair)" />

  <!-- Face features (minimal, painterly) -->
  <!-- Eyebrows -->
  <path d="M 100 148 Q 106 145 113 148" stroke="#3A2E28" stroke-width="1.4" fill="none" stroke-linecap="round" />
  <path d="M 128 148 Q 134 145 141 148" stroke="#3A2E28" stroke-width="1.4" fill="none" stroke-linecap="round" />

  <!-- Eyes (closed / peaceful) -->
  <path d="M 100 158 Q 106 162 113 158" stroke="#2C2A28" stroke-width="1.4" fill="none" stroke-linecap="round" />
  <path d="M 128 158 Q 134 162 141 158" stroke="#2C2A28" stroke-width="1.4" fill="none" stroke-linecap="round" />
  <!-- Lash hint -->
  <path d="M 112 158 L 114 161" stroke="#2C2A28" stroke-width="1" stroke-linecap="round" />
  <path d="M 140 158 L 142 161" stroke="#2C2A28" stroke-width="1" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 120 165 Q 118 175 121 180 Q 124 181 126 178" stroke="#D4A88A" stroke-width="0.9" fill="none" stroke-linecap="round" />

  <!-- Cheeks blush -->
  <ellipse cx="98" cy="176" rx="7" ry="3.5" fill="#E8B4A0" opacity="0.55" />
  <ellipse cx="142" cy="176" rx="7" ry="3.5" fill="#E8B4A0" opacity="0.55" />

  <!-- Lips -->
  <path d="M 114 188 Q 120 191 126 188" stroke="#B26E64" stroke-width="1.4" fill="none" stroke-linecap="round" />
  <path d="M 114 188 Q 120 185 126 188" stroke="#B26E64" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Small earring hint -->
  <circle cx="80" cy="170" r="1.2" fill="#8DA290" />
  <circle cx="160" cy="170" r="1.2" fill="#8DA290" />

  <!-- Frame subtle inner border -->
</svg>
